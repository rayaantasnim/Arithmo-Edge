name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Lint & validate client JS
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify static dist bundle integrity
        run: |
          node --check dist/assets/js/main.js
          test -f dist/.nojekyll
          test -f dist/assets/css/style.css
          for page in index why-arithmo architecture arenas-elo contests ai-core security-qprt4 academies pricing socials-forge governance roadmap pioneers; do
            test -f "dist/${page}.html" || { echo "Missing dist/${page}.html"; exit 1; }
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
